name: iOS Cloud Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - ios-cloud-build-2026-08-25
    paths:
      - '.github/workflows/ios-cloud-build.yml'

jobs:
  build-ios:
    runs-on: macos-26-intel
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Get Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Compile iOS app without signing
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Save compiled app as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fidel-ios-unsigned-build
          path: app/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7
